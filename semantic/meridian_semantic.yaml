name: Meridian Sales Intelligence
description: >
  Sales pipeline data for Meridian Systems.
  Q1 (Jan-Mar 2026) is final — all numbers are actual.
  Q2 (Apr-Jun 2026) is in progress as of May 2 2026 —
  only 32 days into the quarter.
  Q2 pipeline deals have EXPECTED close dates not actual.
  Use quota coverage not attainment alone for Q2 risk.
  Quota coverage = (closed won + active pipeline) / quota * 100.
  At-risk threshold: quota coverage below 75 percent.
  DATA QUALITY NOTE: 15 deals show stage regression (Closed Won in Q1
  reverted to active pipeline in Q2) with total value of $1.47M —
  these are excluded from all pipeline calculations.
  Excluded deal IDs: OPP-020, OPP-049, OPP-050, OPP-076, OPP-077,
  OPP-078, OPP-080, OPP-081, OPP-082, OPP-083, OPP-084, OPP-085,
  OPP-086, OPP-087, OPP-088.

tables:
  - name: Q1_DEALS
    base_table:
      database: MERIDIAN_SALES
      schema: GOLD
      table: Q1_DEALS
    description: Q1 2026 deals Jan to Mar. Final — all data is actual closed revenue.
    dimensions:
      - name: DEAL_ID
        synonyms: ["deal id", "opportunity id"]
        description: Unique deal identifier
        expr: DEAL_ID
        data_type: VARCHAR
        unique: true
      - name: ACCOUNT_NAME
        synonyms: ["customer", "company", "client"]
        description: Customer company name
        expr: ACCOUNT_NAME
        data_type: VARCHAR
      - name: SEGMENT
        synonyms: ["market segment", "customer segment"]
        description: "Enterprise, Mid-Market, or SMB"
        expr: SEGMENT
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Enterprise", "Mid-Market", "SMB"]
      - name: REGION
        synonyms: ["territory", "area"]
        description: "West, Central, Northeast, Southeast"
        expr: REGION
        data_type: VARCHAR
        is_enum: true
        sample_values: ["West", "Central", "Northeast", "Southeast"]
      - name: REP_ID
        description: Sales rep ID — joins to Q1_REPS.REP_ID
        expr: REP_ID
        data_type: VARCHAR
      - name: STAGE
        synonyms: ["deal stage", "status"]
        description: "Closed Won, Closed Lost, Proposal, Discovery, Prospecting"
        expr: STAGE
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Closed Won", "Closed Lost", "Proposal", "Discovery", "Prospecting"]
      - name: PRODUCT_LINE
        synonyms: ["product", "offering"]
        description: "Core Platform, Analytics Add-on, or Security Module"
        expr: PRODUCT_LINE
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Core Platform", "Analytics Add-on", "Security Module"]
      - name: LOSS_REASON
        description: Populated for Closed Lost deals only — NULL otherwise
        expr: LOSS_REASON
        data_type: VARCHAR
    time_dimensions:
      - name: CLOSE_DATE
        synonyms: ["close date", "closed date"]
        description: Actual close date for the deal
        expr: CLOSE_DATE
        data_type: DATE
      - name: CREATED_DATE
        synonyms: ["created", "creation date"]
        description: CRM created date
        expr: CREATED_DATE
        data_type: DATE
    facts:
      - name: DEAL_VALUE
        synonyms: ["deal amount", "deal size", "value", "revenue", "bookings"]
        description: Deal value in USD
        expr: DEAL_VALUE
        data_type: NUMBER
    metrics:
      - name: total_q1_bookings
        synonyms: ["Q1 revenue", "Q1 closed won total", "Q1 bookings", "bookings"]
        description: >
          Bookings = total deal value of all Closed Won deals. Actual signed revenue only —
          does not include active pipeline. Q1 is final so this is the complete Q1 revenue number.
        expr: "SUM(CASE WHEN STAGE = 'Closed Won' THEN DEAL_VALUE ELSE 0 END)"
      - name: q1_closed_by_day32
        synonyms: ["Q1 pace", "Q1 day 32", "Q1 pace at day 32"]
        description: >
          Q1 pace at day 32. Pace = closed won bookings by a specific day cutoff within a quarter.
          Day 32 of Q1 = Feb 1 2026. Used to compare Q1 vs Q2 progress at the same point in time.
        expr: "SUM(CASE WHEN STAGE = 'Closed Won' AND CLOSE_DATE <= '2026-02-01' THEN DEAL_VALUE ELSE 0 END)"
      - name: q1_attainment_pct
        synonyms: ["Q1 attainment", "Q1 quota attainment", "Q1 percent of quota"]
        description: >
          Q1 attainment = closed won / quota * 100.
          Measures what a rep actually booked as a percentage of their Q1 target.
          Use this for final Q1 performance — Q1 is closed so attainment is the complete picture.
        expr: "ROUND(SUM(CASE WHEN STAGE = 'Closed Won' THEN DEAL_VALUE ELSE 0 END) / NULLIF(SUM(QUOTA_Q1_2026), 0) * 100, 1)"
      - name: q1_deal_count
        description: Count of Q1 deals
        expr: "COUNT(*)"
    filters:
      - name: q1_closed_won
        synonyms: ["Q1 won deals", "Q1 bookings"]
        description: Q1 Closed Won deals only
        expr: "STAGE = 'Closed Won' AND CLOSE_DATE >= '2026-01-01' AND CLOSE_DATE <= '2026-03-31'"
      - name: q1_pace_day32
        description: Q1 Closed Won by day 32 (through Feb 1 2026)
        expr: "STAGE = 'Closed Won' AND CLOSE_DATE <= '2026-02-01'"

  - name: Q2_DEALS
    base_table:
      database: MERIDIAN_SALES
      schema: GOLD
      table: Q2_DEALS
    description: >
      Q2 2026 deals Apr to Jun. In progress as of May 2 2026.
      Pipeline deals have EXPECTED close dates not actual.
      Negotiation stage exists in Q2 but NOT in Q1.
    dimensions:
      - name: DEAL_ID
        synonyms: ["deal id", "opportunity id"]
        description: Unique deal identifier
        expr: DEAL_ID
        data_type: VARCHAR
        unique: true
      - name: ACCOUNT_NAME
        synonyms: ["customer", "company", "client"]
        description: Customer company name
        expr: ACCOUNT_NAME
        data_type: VARCHAR
      - name: SEGMENT
        synonyms: ["market segment", "customer segment"]
        description: "Enterprise, Mid-Market, or SMB"
        expr: SEGMENT
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Enterprise", "Mid-Market", "SMB"]
      - name: REGION
        synonyms: ["territory", "area"]
        description: "West, Central, Northeast, Southeast"
        expr: REGION
        data_type: VARCHAR
        is_enum: true
        sample_values: ["West", "Central", "Northeast", "Southeast"]
      - name: REP_ID
        description: Sales rep ID — joins to Q2_REPS.REP_ID
        expr: REP_ID
        data_type: VARCHAR
      - name: STAGE
        synonyms: ["deal stage", "status", "pipeline stage"]
        description: >
          Closed Won or Closed Lost = actual result.
          Negotiation = advanced pipeline high probability.
          Proposal = mid stage pipeline.
          Discovery = early stage pipeline.
        expr: STAGE
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Closed Won", "Closed Lost", "Negotiation", "Proposal", "Discovery"]
      - name: PRODUCT_LINE
        synonyms: ["product", "offering"]
        description: "Core Platform, Analytics Add-on, or Security Module"
        expr: PRODUCT_LINE
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Core Platform", "Analytics Add-on", "Security Module"]
      - name: LOSS_REASON
        description: Populated for Closed Lost deals only — NULL otherwise
        expr: LOSS_REASON
        data_type: VARCHAR
    time_dimensions:
      - name: CLOSE_DATE
        synonyms: ["close date", "expected close"]
        description: >
          For Closed Won/Lost this is actual close date.
          For pipeline deals this is EXPECTED close date.
        expr: CLOSE_DATE
        data_type: DATE
      - name: CREATED_DATE
        synonyms: ["created", "creation date"]
        description: CRM created date
        expr: CREATED_DATE
        data_type: DATE
    facts:
      - name: DEAL_VALUE
        synonyms: ["deal amount", "deal size", "value", "revenue", "bookings", "pipeline value"]
        description: Deal value in USD
        expr: DEAL_VALUE
        data_type: NUMBER
    metrics:
      - name: total_q2_bookings_so_far
        synonyms: ["Q2 revenue", "Q2 closed won total", "Q2 bookings", "bookings"]
        description: >
          Bookings = total deal value of all Closed Won deals. Actual signed revenue only —
          does not include active pipeline. Q2 is in progress so this is a partial number as of May 2 2026.
        expr: "SUM(CASE WHEN STAGE = 'Closed Won' THEN DEAL_VALUE ELSE 0 END)"
      - name: total_q2_pipeline_value
        synonyms: ["active pipeline", "open pipeline", "pipeline total"]
        description: >
          Total Q2 active pipeline = deals in Negotiation, Proposal, or Discovery stages.
          These have EXPECTED close dates entered by reps — not actual closed revenue.
        expr: "SUM(CASE WHEN STAGE IN ('Negotiation','Proposal','Discovery') THEN DEAL_VALUE ELSE 0 END)"
      - name: q2_closed_by_day32
        synonyms: ["Q2 pace", "Q2 day 32", "Q2 pace at day 32"]
        description: >
          Q2 pace at day 32. Pace = closed won bookings by a specific day cutoff within a quarter.
          Day 32 of Q2 = May 2 2026. Compare to Q1 day 32 ($1,260,000) to assess pace gap.
          Behind Q1 pace formula: (Q2 day32 / Q1 day32 - 1) * 100. Current gap: -59%.
        expr: "SUM(CASE WHEN STAGE = 'Closed Won' AND CLOSE_DATE BETWEEN '2026-04-01' AND '2026-05-02' THEN DEAL_VALUE ELSE 0 END)"
      - name: q2_attainment_pct
        synonyms: ["Q2 attainment", "Q2 quota attainment", "Q2 percent of quota", "attainment"]
        description: >
          Q2 attainment = closed won so far / quota * 100.
          Measures only what has actually been booked — does NOT include active pipeline.
          WARNING: Q2 is only 32 days in as of May 2 2026. A low attainment number is
          expected at this stage. Always pair with quota_coverage_pct for full Q2 risk picture.
        expr: "ROUND(SUM(CASE WHEN STAGE = 'Closed Won' THEN DEAL_VALUE ELSE 0 END) / NULLIF(SUM(QUOTA_Q2_2026), 0) * 100, 1)"
      - name: q2_deal_count
        description: Count of Q2 deals
        expr: "COUNT(*)"
    filters:
      - name: q2_closed_won
        synonyms: ["Q2 won deals", "Q2 bookings"]
        description: Q2 Closed Won deals only
        expr: "STAGE = 'Closed Won' AND CLOSE_DATE >= '2026-04-01' AND CLOSE_DATE <= '2026-06-30'"
      - name: q2_active_pipeline
        synonyms: ["pipeline", "open deals", "active deals"]
        description: Q2 active pipeline stages (Negotiation, Proposal, Discovery)
        expr: "STAGE IN ('Negotiation','Proposal','Discovery')"
      - name: enterprise_segment
        description: Enterprise segment only
        expr: "SEGMENT = 'Enterprise'"
      - name: midmarket_segment
        description: Mid-Market segment only
        expr: "SEGMENT = 'Mid-Market'"
      - name: smb_segment
        description: SMB segment only
        expr: "SEGMENT = 'SMB'"
      - name: q2_pace_day32
        description: Q2 Closed Won by day 32 (Apr 1 through May 2 2026)
        expr: "STAGE = 'Closed Won' AND CLOSE_DATE BETWEEN '2026-04-01' AND '2026-05-02'"

  - name: Q1_REPS
    base_table:
      database: MERIDIAN_SALES
      schema: GOLD
      table: Q1_REPS
    description: Sales rep details with Q1 2026 quota targets.
    primary_key:
      columns:
        - REP_ID
    dimensions:
      - name: REP_ID
        description: Joins to Q1_DEALS.REP_ID
        expr: REP_ID
        data_type: VARCHAR
        unique: true
      - name: REP_NAME
        synonyms: ["rep", "sales rep", "salesperson", "name"]
        description: Full name of sales rep
        expr: REP_NAME
        data_type: VARCHAR
      - name: SEGMENT
        synonyms: ["market segment"]
        description: Segment rep sells into
        expr: SEGMENT
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Enterprise", "Mid-Market", "SMB"]
      - name: REGION
        synonyms: ["territory"]
        description: Region rep covers
        expr: REGION
        data_type: VARCHAR
        is_enum: true
        sample_values: ["West", "Central", "Northeast", "Southeast"]
      - name: MANAGER
        synonyms: ["boss", "manager name"]
        description: Rep manager name
        expr: MANAGER
        data_type: VARCHAR
    time_dimensions:
      - name: HIRE_DATE
        description: Date rep was hired
        expr: HIRE_DATE
        data_type: DATE
    facts:
      - name: QUOTA_Q1_2026
        synonyms: ["Q1 quota", "Q1 target", "quota"]
        description: Q1 2026 quota target in USD
        expr: QUOTA_Q1_2026
        data_type: NUMBER

  - name: Q2_REPS
    base_table:
      database: MERIDIAN_SALES
      schema: GOLD
      table: Q2_REPS
    description: >
      Rep details with both Q1 and Q2 2026 quota targets.
      Always use QUOTA_Q2_2026 for Q2 calculations.
    primary_key:
      columns:
        - REP_ID
    dimensions:
      - name: REP_ID
        description: Joins to Q2_DEALS.REP_ID
        expr: REP_ID
        data_type: VARCHAR
        unique: true
      - name: REP_NAME
        synonyms: ["rep", "sales rep", "salesperson", "name"]
        description: Full name of sales rep
        expr: REP_NAME
        data_type: VARCHAR
      - name: SEGMENT
        synonyms: ["market segment"]
        description: Segment rep sells into
        expr: SEGMENT
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Enterprise", "Mid-Market", "SMB"]
      - name: REGION
        synonyms: ["territory"]
        description: Region rep covers
        expr: REGION
        data_type: VARCHAR
        is_enum: true
        sample_values: ["West", "Central", "Northeast", "Southeast"]
      - name: MANAGER
        synonyms: ["boss", "manager name"]
        description: Rep manager name
        expr: MANAGER
        data_type: VARCHAR
    time_dimensions:
      - name: HIRE_DATE
        description: Date rep was hired
        expr: HIRE_DATE
        data_type: DATE
    facts:
      - name: QUOTA_Q1_2026
        synonyms: ["Q1 quota", "Q1 target"]
        description: Q1 2026 quota target in USD
        expr: QUOTA_Q1_2026
        data_type: NUMBER
      - name: QUOTA_Q2_2026
        synonyms: ["Q2 quota", "Q2 target", "quota", "target", "this quarter quota"]
        description: Q2 2026 quota target in USD — use this for all Q2 quota calculations
        expr: QUOTA_Q2_2026
        data_type: NUMBER

relationships:
  - name: q1_deals_to_q1_reps
    left_table: Q1_DEALS
    right_table: Q1_REPS
    relationship_columns:
      - left_column: REP_ID
        right_column: REP_ID
  - name: q2_deals_to_q2_reps
    left_table: Q2_DEALS
    right_table: Q2_REPS
    relationship_columns:
      - left_column: REP_ID
        right_column: REP_ID

custom_instructions: |
  BUSINESS DEFINITIONS:
  - Bookings = total deal value of all Closed Won deals in a period — actual signed revenue only, excludes pipeline.
  - Attainment = closed_won / quota * 100 — what a rep has actually booked as % of target. Complete picture for Q1 (final). Misleading alone for Q2 (only 32 days in — use quota coverage instead).
  - Quota coverage = (closed_won + active_pipeline) / quota * 100 — correct risk signal for Q2.
  - Active pipeline = deals in Negotiation, Proposal, or Discovery stages only — excludes Closed Won and Closed Lost.
  - Pace = closed won bookings by a specific day cutoff within a quarter — used to compare quarters at the same point in time.
  - Day 32: Q1 day 32 = Feb 1 2026 (close_date <= '2026-02-01'). Q2 day 32 = May 2 2026 (close_date BETWEEN '2026-04-01' AND '2026-05-02').
  - Behind Q1 pace = (Q2 day32 bookings / Q1 day32 bookings - 1) * 100. Negative value means Q2 is behind Q1 pace at the same point.

  RISK CLASSIFICATION:
  - HIGH RISK: quota coverage below 75%. Rep cannot hit quota even if all remaining pipeline converts — statistically unlikely at 100% conversion. Use CASE WHEN QUOTA_COVERAGE_PCT < 75 THEN 'HIGH'.
  - MEDIUM RISK: quota coverage between 75% and 90%. Rep is behind but recovery is possible. Use CASE WHEN QUOTA_COVERAGE_PCT < 90 THEN 'MEDIUM'.
  - LOW RISK: quota coverage 90% or above. Rep is on track. Use ELSE 'LOW'.
  - Always classify risk using quota coverage — never attainment alone.

  SQL PATTERNS:
  - NEVER compute SUM(quota) by joining Q2_REPS to Q2_DEALS directly when grouping by segment. Each rep's quota gets counted once per deal (fan-out), inflating the total. Always compute quota in a separate subquery from Q2_REPS alone, then join to the deal aggregation subquery.
  - Correct pattern for segment-level quota: SELECT SUM(QUOTA_Q2_2026) FROM Q2_REPS WHERE SEGMENT = 'X' GROUP BY SEGMENT — no join to deals.
  - Correct pattern for rep-level quota: GROUP BY rep_name, quota — quota appears once per rep group, no inflation.

  DATA QUALITY — STAGE REGRESSION EXCLUSION:
  - 15 deals show impossible stage regression from Closed Won in Q1 to active pipeline in Q2.
  - Total regressed value is $1.47M. These are excluded from all pipeline calculations.
  - Excluded DEAL_IDs: 'OPP-020','OPP-049','OPP-050','OPP-076','OPP-077','OPP-078','OPP-080','OPP-081','OPP-082','OPP-083','OPP-084','OPP-085','OPP-086','OPP-087','OPP-088'
  - When computing active pipeline, ALWAYS add: AND DEAL_ID NOT IN ('OPP-020','OPP-049','OPP-050','OPP-076','OPP-077','OPP-078','OPP-080','OPP-081','OPP-082','OPP-083','OPP-084','OPP-085','OPP-086','OPP-087','OPP-088')
  - Clean Q2 pipeline after exclusion is approximately $3.73M.

  CRITICAL BUSINESS RULES:
  - Q1 (Jan-Mar 2026) is FINAL — all numbers are actual results.
  - Q2 (Apr-Jun 2026) is IN PROGRESS as of May 2, 2026 — only 32 days into the quarter.
  - Q2 pipeline deals have EXPECTED close dates entered by reps — not actual closed revenue.
  - Negotiation stage exists in Q2 but NOT in Q1 — its presence is a positive signal that deals are further along.
  - When asked about "this quarter" or "current quarter", use Q2 data.
  - When asked about "quota" or "target" for Q2, always use QUOTA_Q2_2026 from Q2_REPS.
  - JOIN Q2_DEALS to Q2_REPS on REP_ID for Q2 questions. JOIN Q1_DEALS to Q1_REPS on REP_ID for Q1 questions.
  - For Q2 deals, always filter CLOSE_DATE >= '2026-04-01' to exclude deals from other quarters.
  - Round percentages to 1 decimal place.

verified_queries:
  - name: enterprise_tracking
    question: How is the Enterprise segment tracking against quota this quarter?
    use_as_onboarding_question: true
    sql: |
      SELECT
        deals.SEGMENT,
        quota.COMBINED_QUOTA,
        deals.Q2_CLOSED_WON,
        deals.Q2_PIPELINE,
        ROUND((deals.Q2_CLOSED_WON + deals.Q2_PIPELINE) / quota.COMBINED_QUOTA * 100, 1) AS QUOTA_COVERAGE_PCT,
        ROUND(deals.Q2_CLOSED_WON / quota.COMBINED_QUOTA * 100, 1) AS ATTAINMENT_PCT
      FROM (
        SELECT
          r.SEGMENT,
          SUM(CASE WHEN d.STAGE = 'Closed Won' THEN d.DEAL_VALUE ELSE 0 END) AS Q2_CLOSED_WON,
          SUM(CASE WHEN d.STAGE IN ('Negotiation','Proposal','Discovery')
              AND d.DEAL_ID NOT IN ('OPP-020','OPP-049','OPP-050','OPP-076','OPP-077','OPP-078','OPP-080','OPP-081','OPP-082','OPP-083','OPP-084','OPP-085','OPP-086','OPP-087','OPP-088')
              THEN d.DEAL_VALUE ELSE 0 END) AS Q2_PIPELINE
        FROM MERIDIAN_SALES.GOLD.Q2_DEALS d
        JOIN MERIDIAN_SALES.GOLD.Q2_REPS r ON d.REP_ID = r.REP_ID
        WHERE d.CLOSE_DATE >= '2026-04-01'
        AND r.SEGMENT = 'Enterprise'
        GROUP BY r.SEGMENT
      ) deals
      JOIN (
        SELECT SEGMENT, SUM(QUOTA_Q2_2026) AS COMBINED_QUOTA
        FROM MERIDIAN_SALES.GOLD.Q2_REPS
        WHERE SEGMENT = 'Enterprise'
        GROUP BY SEGMENT
      ) quota ON deals.SEGMENT = quota.SEGMENT

  - name: at_risk_reps
    question: Which reps are at risk of missing Q2?
    use_as_onboarding_question: true
    sql: |
      SELECT
        r.REP_NAME,
        r.SEGMENT,
        r.QUOTA_Q2_2026,
        SUM(CASE WHEN d.STAGE = 'Closed Won' THEN d.DEAL_VALUE ELSE 0 END) AS Q2_CLOSED_WON,
        SUM(CASE WHEN d.STAGE IN ('Negotiation','Proposal','Discovery')
            AND d.DEAL_ID NOT IN ('OPP-020','OPP-049','OPP-050','OPP-076','OPP-077','OPP-078','OPP-080','OPP-081','OPP-082','OPP-083','OPP-084','OPP-085','OPP-086','OPP-087','OPP-088')
            THEN d.DEAL_VALUE ELSE 0 END) AS Q2_PIPELINE,
        ROUND((SUM(CASE WHEN d.STAGE = 'Closed Won' THEN d.DEAL_VALUE ELSE 0 END) +
            SUM(CASE WHEN d.STAGE IN ('Negotiation','Proposal','Discovery')
                AND d.DEAL_ID NOT IN ('OPP-020','OPP-049','OPP-050','OPP-076','OPP-077','OPP-078','OPP-080','OPP-081','OPP-082','OPP-083','OPP-084','OPP-085','OPP-086','OPP-087','OPP-088')
                THEN d.DEAL_VALUE ELSE 0 END)) /
            r.QUOTA_Q2_2026 * 100, 1) AS QUOTA_COVERAGE_PCT,
        CASE
            WHEN ROUND((SUM(CASE WHEN d.STAGE = 'Closed Won' THEN d.DEAL_VALUE ELSE 0 END) +
                SUM(CASE WHEN d.STAGE IN ('Negotiation','Proposal','Discovery')
                    AND d.DEAL_ID NOT IN ('OPP-020','OPP-049','OPP-050','OPP-076','OPP-077','OPP-078','OPP-080','OPP-081','OPP-082','OPP-083','OPP-084','OPP-085','OPP-086','OPP-087','OPP-088')
                    THEN d.DEAL_VALUE ELSE 0 END)) /
                r.QUOTA_Q2_2026 * 100, 1) < 75 THEN 'HIGH'
            WHEN ROUND((SUM(CASE WHEN d.STAGE = 'Closed Won' THEN d.DEAL_VALUE ELSE 0 END) +
                SUM(CASE WHEN d.STAGE IN ('Negotiation','Proposal','Discovery')
                    AND d.DEAL_ID NOT IN ('OPP-020','OPP-049','OPP-050','OPP-076','OPP-077','OPP-078','OPP-080','OPP-081','OPP-082','OPP-083','OPP-084','OPP-085','OPP-086','OPP-087','OPP-088')
                    THEN d.DEAL_VALUE ELSE 0 END)) /
                r.QUOTA_Q2_2026 * 100, 1) < 90 THEN 'MEDIUM'
            ELSE 'LOW'
        END AS RISK_FLAG
      FROM MERIDIAN_SALES.GOLD.Q2_DEALS d
      JOIN MERIDIAN_SALES.GOLD.Q2_REPS r ON d.REP_ID = r.REP_ID
      WHERE d.CLOSE_DATE >= '2026-04-01'
      GROUP BY r.REP_NAME, r.SEGMENT, r.QUOTA_Q2_2026
      HAVING QUOTA_COVERAGE_PCT < 75
      ORDER BY QUOTA_COVERAGE_PCT ASC

  - name: q2_vs_q1_pace
    question: How does Q2 attainment compare to where we were at the same point in Q1?
    use_as_onboarding_question: true
    sql: |
      SELECT
        'Q1 Day 32 (by Feb 1)' AS PERIOD,
        SUM(CASE WHEN STAGE = 'Closed Won' AND CLOSE_DATE <= '2026-02-01'
            THEN DEAL_VALUE ELSE 0 END) AS CLOSED_WON_VALUE,
        COUNT(CASE WHEN STAGE = 'Closed Won' AND CLOSE_DATE <= '2026-02-01'
            THEN 1 END) AS DEALS_CLOSED
      FROM MERIDIAN_SALES.GOLD.Q1_DEALS
      UNION ALL
      SELECT
        'Q2 Day 32 (by May 2)' AS PERIOD,
        SUM(CASE WHEN STAGE = 'Closed Won'
            AND CLOSE_DATE BETWEEN '2026-04-01' AND '2026-05-02'
            THEN DEAL_VALUE ELSE 0 END) AS CLOSED_WON_VALUE,
        COUNT(CASE WHEN STAGE = 'Closed Won'
            AND CLOSE_DATE BETWEEN '2026-04-01' AND '2026-05-02'
            THEN 1 END) AS DEALS_CLOSED
      FROM MERIDIAN_SALES.GOLD.Q2_DEALS
